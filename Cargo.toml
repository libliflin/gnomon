[package]
name = "gnomon"
version = "0.0.2"
edition = "2024"
description = "Performance budget auditor for static sites. A CI gate, not a dashboard."
license = "MIT OR Apache-2.0"
repository = "https://github.com/libliflin/gnomon"
readme = "README.md"
keywords = ["performance", "web", "audit", "ci", "budget"]
categories = ["command-line-utilities", "web-programming"]

[lib]
name = "gnomon"
path = "src/lib.rs"

[[bin]]
name = "gnomon"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "brotli", "gzip", "deflate"] }
scraper = "0.20"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
anyhow = "1"
owo-colors = "4"
brotli = "7"
flate2 = "1"
futures = "0.3"
humansize = "2"
aho-corasick = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
